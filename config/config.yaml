# Configuration file for the Snakemake pipeline

# Path to the CSV file containing sample information
samples_file: "config/samples.csv"

# Path to conda environment
scanpy_env: '/private/groups/russelllab/jodie/miniforge3/envs/scanpy'
cyclum_env: '/private/groups/russelllab/jodie/miniforge3/envs/cyclum'
kallisto_env: "/private/groups/russelllab/jodie/miniforge3/envs/kallisto_bustools"
sra_tools_env: "/private/groups/russelllab/jodie/miniforge3/envs/sra-tools"

# Path to kallisto_index/genome:
# Path to genome reference files, keyed by the genome name used in column 2 of samples.csv:
Dmel_wMel: "/private/groups/russelllab/jodie/scRNAseq/reference/Drosophila_melanogaster_wMel_combined_16S"
Dmel_wRi_Riv84: "/private/groups/russelllab/jodie/scRNAseq/reference/Drosophila_melanogaster_wRi_Riv84_combined_16S"
Dmel_wWil: "/private/groups/russelllab/jodie/scRNAseq/reference/Drosophila_melanogaster_wWil_combined_16S"
Dsim_wMel: "/private/groups/russelllab/jodie/scRNAseq/reference/Drosophila_simulans_wMel_combined_16S"
Dsim_wRi_M23: "/private/groups/russelllab/jodie/scRNAseq/reference/Drosophila_simulans_wRi_M23_combined_16S"
Dsim_wRi_Riv84: "/private/groups/russelllab/jodie/scRNAseq/reference/Drosophila_simulans_wRi_Riv84_combined_16S"
Dwil_wWil: "/private/groups/russelllab/jodie/scRNAseq/reference/Drosophila_willistoni_wWil_combined_16S"
# All 7 genome dirs above are built by build_combined_host_wolbachia_references.sh
# (host genome+GTF + that Wolbachia strain's genome+GTF + shared 16S reference,
# concatenated and run through gffread + kb ref together).

# rRNA gene lists for the Wolbachia titer calculation (calculate_wolbachia_titer
# in the filter script), keyed by host species and by Wolbachia strain instead
# of a single hardcoded Dmel+wMel gene list. Generated by:
#   python3 snakemake_scripts/reference/find_rrna_genes.py <gtf> > <out>.txt
# Host lists: run against each species' symbol-swapped GTF by
# build_dmel_dsim_dwil_transcriptomes.sh -> kallisto_ref/host_rrna_genes.txt.
# Symbiont lists: run against each strain's own (unswapped) GTF by
# build_combined_host_wolbachia_references.sh -> rrna_genes.txt next to that
# strain's source GTF.
host_rrna_genes:
  Dmel: "/private/groups/russelllab/jodie/scRNAseq/reference/Flybase_genomes/Drosophila_melanogaster/kallisto_ref/host_rrna_genes.txt"
  Dsim: "/private/groups/russelllab/jodie/scRNAseq/reference/Flybase_genomes/Drosophila_simulans/kallisto_ref/host_rrna_genes.txt"
  Dwil: "/private/groups/russelllab/jodie/scRNAseq/reference/Flybase_genomes/Drosophila_willistoni/kallisto_ref/host_rrna_genes.txt"

symbiont_rrna_genes:
  wMel:      "/private/groups/russelllab/jodie/scRNAseq/reference/wMel_GCF_016584425.1/rrna_genes.txt"
  wRi_M23:   "/private/groups/russelllab/jodie/scRNAseq/reference/wRi_M23_GCA_979474595.1/rrna_genes.txt"
  wRi_Riv84: "/private/groups/russelllab/jodie/scRNAseq/reference/wRi_Riv84_GCF_000022285.1/rrna_genes.txt"
  wWil:      "/private/groups/russelllab/jodie/scRNAseq/reference/wWil_GCF_040084705.1/rrna_genes.txt"

# Single 16S rRNA gene (locus_tag) per Wolbachia strain, used by the
# count_16s_reads rule to quantify 16S rRNA reads via read alignment
# (separate from the transcriptome-level Wolbachia titer calculated from
# symbiont_rrna_genes above). Genomic coordinates are resolved automatically
# from that strain's own GTF (wolbachia_genome[strain].gtf) at rule-eval
# time -- only the locus_tag needs to be supplied here.
symbiont_16s_gene:
  wMel:      "GQX67_RS05935"
  wRi_Riv84: "WRI_RS06005"
  wRi_M23:   "M23_00679"
  wWil:      "ABL518_RS01510"

# Maps each genome key used in samples.csv (column 2) to its host species and
# Wolbachia strain, so filter_h5ad can look up the right pair of rRNA gene
# lists above for any species x strain combination without hardcoding
# per-sample/per-genome logic in the Snakefile. Add a row here whenever a new
# genome key is added above or to samples.csv.
genome_components:
  Dmel_wMel:      {host: Dmel, symbiont: wMel}
  Dmel_wRi_Riv84: {host: Dmel, symbiont: wRi_Riv84}
  Dmel_wWil:      {host: Dmel, symbiont: wWil}
  Dsim_wMel:      {host: Dsim, symbiont: wMel}
  Dsim_wRi_M23:   {host: Dsim, symbiont: wRi_M23}
  Dsim_wRi_Riv84: {host: Dsim, symbiont: wRi_Riv84}
  Dwil_wWil:      {host: Dwil, symbiont: wWil}

# Source genome fasta/GTF the build_host_transcriptome, build_symbiont_rrna_list,
# and build_combined_reference Snakemake rules build from. dsim's fasta/gtf are
# fetched by the download_dsim_annotation rule if not already present; the
# others are expected to already exist on disk.
host_genome:
  Dmel: {fasta: "/private/groups/russelllab/jodie/scRNAseq/reference/Flybase_genomes/Drosophila_melanogaster/dmel-all-aligned-r6.68.fasta",
         gtf:   "/private/groups/russelllab/jodie/scRNAseq/reference/Flybase_genomes/Drosophila_melanogaster/dmel-all-r6.68.gtf"}
  Dsim: {fasta: "/private/groups/russelllab/jodie/scRNAseq/reference/Flybase_genomes/Drosophila_simulans/dsim-all-chromosome-r2.02.fasta",
         gtf:   "/private/groups/russelllab/jodie/scRNAseq/reference/Flybase_genomes/Drosophila_simulans/dsim-all-r2.02.gtf"}
  Dwil: {fasta: "/private/groups/russelllab/jodie/scRNAseq/reference/Flybase_genomes/Drosophila_willistoni/dwil-all-chromosome-r1.04.fasta",
         gtf:   "/private/groups/russelllab/jodie/scRNAseq/reference/Flybase_genomes/Drosophila_willistoni/dwil-all-r1.04.gtf"}

wolbachia_genome:
  wMel:      {fasta: "/private/groups/russelllab/jodie/scRNAseq/reference/wMel_GCF_016584425.1/GCF_016584425.1_ASM1658442v1_genomic.fna",
              gtf:   "/private/groups/russelllab/jodie/scRNAseq/reference/wMel_GCF_016584425.1/wMel_GCF_016584425.1.gtf"}
  wRi_Riv84: {fasta: "/private/groups/russelllab/jodie/scRNAseq/reference/wRi_Riv84_GCF_000022285.1/GCF_000022285.1_ASM2228v1_genomic.fna",
              gtf:   "/private/groups/russelllab/jodie/scRNAseq/reference/wRi_Riv84_GCF_000022285.1/wRi_Riv84_GCF_000022285.1.gtf"}
  wRi_M23:   {fasta: "/private/groups/russelllab/jodie/scRNAseq/reference/wRi_M23_GCA_979474595.1/20260402_wRi_M23_pilon.fasta",
              gtf:   "/private/groups/russelllab/jodie/scRNAseq/reference/wRi_M23_GCA_979474595.1/wRi_M23_v3.gtf"}
  wWil:      {fasta: "/private/groups/russelllab/jodie/scRNAseq/reference/wWil_GCF_040084705.1/wWil_GCF_040084705.fna",
              gtf:   "/private/groups/russelllab/jodie/scRNAseq/reference/wWil_GCF_040084705.1/wWil_GCF_040084705.1.gtf"}

sixteen_s_fasta: "/private/groups/russelllab/jodie/scRNAseq/reference/highly_represented_16S/highly_represented_16S_filtered.renamed.fasta"
sixteen_s_gtf:   "/private/groups/russelllab/jodie/scRNAseq/reference/16S_fixed.gtf"

swap_gene_id_script:    "snakemake_scripts/reference/swap_gene_id_to_symbol.py"
find_rrna_genes_script: "snakemake_scripts/reference/find_rrna_genes.py"

# Dsim -> Dmel FlyBase gene ID orthologs (reciprocal best hit), used by the
# integrate script to translate Dsim samples' adata.var gene IDs onto the
# corresponding Dmel FlyBase ID so Dsim and Dmel samples integrate gene-for-
# gene. Columns: Dsim, Dmel, pident, evalue, bitscore.
ortholog_map: "/private/groups/russelllab/jodie/scRNAseq/reference/orthologs/dmel_dsim_orthologs_rbh.tsv"

# Software paths
fastq_dir: "/private/groups/russelllab/jodie/sequencing_data/scRNAseq/PIP-seq_cells/Jacobs_10524_241203B9" # Add the path to the directory containing the FASTQ files for pipseq
combine_script: "snakemake_scripts/analysis/integrate_h5ad_by_condition.py"
filter_script: "snakemake_scripts/filtering/kallisto_bustools_qcfilter_adata_no_pybiomart.py" # Changes to remove biomart dependancy on 3/25/26
cell_cycle_script: "snakemake_scripts/analysis/cyclum_cell_cycle.py"
cyclum_analysis_script: "snakemake_scripts/analysis/cyclum_cellcycle_analysis.py"
# Canonical t2g used by downstream steps that run on the fully-integrated,
# multi-species h5ad (cluster_marker_pathway, nmf_annotate_programs). Per-sample
# kallisto mapping (map_pipseq/map_10x) instead pulls index.idx/t2g.txt from
# each sample's own genome directory above.
transcripts_to_genes: "/private/groups/russelllab/jodie/scRNAseq/reference/Drosophila_melanogaster_wMel_combined_16S/t2g.txt"
project_cell_cycle_script: "snakemake_scripts/method_comparison/integrate_by_ref.py"

# Compute resources for cellranger 
cellranger_threads: 16
cellranger_cpus: 16
cellranger_mem: 500000  # MB
cellranger_time: "2:00:00"  # HH:MM:SS
cellranger_partition: "medium"  # SLURM partition for cellranger jobs

# Compute resources for pipseeker
pipseeker_threads: 16
pipseeker_cpus: 16
pipseeker_mem: 1000000  # MB
pipseeker_time: "2:00:00"  # HH:MM:SS
pipseeker_partition: "medium"  # SLURM partition for pipseeker jobs

# Compute resources for combining files
combine_threads: 128
combine_cpus: 4
combine_mem: 32000  # MB
combine_time: "2:00:00"  # HH:MM:SS
combine_partition: "medium"  # SLURM partition for combine jobs

# Compute resources for filter
filter_threads: 128
filter_cpus: 16
filter_mem: 1000000  # MB
filter_time: "12:00:00"  # HH:MM:SS
filter_partition: "medium"  # SLURM partition for filter jobs

# Compute resources for cell cycle
cell_cycle_threads: 64           # Instead of 128
cell_cycle_mem: 1000000           # Instead of 32000  
cell_cycle_time: "12:00:00"     # More time
cell_cycle_partition: "medium"  

# Extract 16S reads
target_gene: "GQX67_05945"
rRNA_regions: "reference/rRNA/rRNA_regions.bed"
extract_gene_script: "snakemake_scripts/filter_bus_by_gene.py"
ref_fasta: "reference/rRNA/rRNA_reference_Dmel_wMel.fasta"
ref_bed: "reference/rRNA/Dmel_wMel_rRNA.gene.bed"
plot_coverage_script: "snakemake_scripts/rRNA_analysis/plot_coverage.py"
plot_blast_script: "snakemake_scripts/rRNA_analysis/plot_blast_pie_charts.py"
min_blast_reads: 100
blast_db: "blast_db/16S_ribosomal_RNA_plus_wolbachia"

# Method comparison scripts
validate_pipseq_script: "snakemake_scripts/method_comparison/validate_pipseq_v2.py"
validate_threads: 16
validate_partition: "medium"
validate_mem: 64000
validate_time: "8:00:00"

# # Cell cycle analysis scripts
# cellcycle_analysis_script: "scripts/method_comparison/cell_cycle_association.py"
# cellcycle_threads: 16
# cellcycle_partition: "medium"
# cellcycle_mem: 64000
# cellcycle_time: "8:00:00"

integrate_script: scripts/method_comparison/integrate_v2.py  # Changed to v2 on 3/25/26
integrate_threads: 16
integrate_partition: "medium"
integrate_mem: 128000
integrate_time: "8:00:00"

# qc_script: "scripts/method_comparison/qc_plots.py"
# qc_threads: 4
# qc_partition: "medium"
# qc_mem: 64000
# qc_time: "2:00:00"

cellcycle_script: "snakemake_scripts/method_comparison/scanpy_cellcycle_analysis_v2.py"
cellcycle_threads: 4
cellcycle_partition: "medium"
cellcycle_mem: 32000
cellcycle_time: "2:00:00"

cluster_marker_pathway_script: "snakemake_scripts/method_comparison/cluster_marker_pathway_analysis.py"
# Optional overrides:
# cluster_marker_de_method: "wilcoxon"
# cluster_marker_top_n: 100
# cluster_marker_threads: 8
# cluster_marker_mem: 64000
# cluster_marker_time: "8:00:00"
# cluster_marker_partition: "medium"

sceptic_script: "snakemake_scripts/method_comparison/run_sceptic.py"
sceptic_method: "xgboost"
sceptic_n_bins: 10
sceptic_threads: 8
sceptic_partition: "medium"
sceptic_mem: 64000
sceptic_time: "4:00:00"

# Gene program and pathway analysis settings
organism: "Fly"
gene_id_type: "flybase"  # Options: "flybase", "symbol", "ensembl"
flybase_annotation: "reference/fbgn_annotation_ID_fb_2025_04.tsv.gz"

# NMF settings
n_programs: 15
n_top_genes: 2000

# Variable for analysis (None = auto-detect)
continuous_var: "wolbachia_titer"  # or None
categorical_var: "treatment"  # or None

# GSEA settings
gene_set_libraries:
  - "GO_Biological_Process_2018"
  - "GO_Cellular_Component_2018"
  - "GO_Molecular_Function_2018"
  - "KEGG_2019"

nmf_threads: 8
nmf_mem: 64000
nmf_partition: "medium"
nmf_time: "4:00:00"

nmf_continuous_threads: 4
nmf_continuous_mem: 32000
nmf_continuous_partition: "medium"
nmf_continuous_time: "2:00:00"

nmf_categorical_threads: 4
nmf_categorical_mem: 32000
nmf_categorical_partition: "medium"
nmf_categorical_time: "2:00:00"

# NMF program annotation
nmf_annotate_script:       "snakemake_scripts/analysis/annotate_nmf_programs.py"
nmf_annotate_sample:       "wolbachia_infection"   # prefix for output file names
nmf_annotate_top_genes:    200                     # top N genes per program for enrichment
nmf_annotate_skip_gsea:    false                   # set true to skip local preranked GSEA
nmf_annotate_skip_flyenrichr: false                # set true if no internet access on nodes

# Cell cycle column names in adata.obs (set by your cell cycle annotation script)
cc_s_var:     "S_score"
cc_g2m_var:   "G2M_score"
cc_phase_var: "phase"

# Resources
nmf_annotate_threads:   8
nmf_annotate_partition: "medium"
nmf_annotate_mem:       32000
nmf_annotate_time:      "4:00:00"

# Pseudotime gene importance 
pseudotime_gene_threads: 16
pseudotime_gene_mem: 128000   # tradeSeq is memory hungry — ~4GB per thread
pseudotime_gene_time: "8:00:00"
pseudotime_gene_time_partition: "medium"
